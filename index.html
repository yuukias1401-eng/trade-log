            </div>
            ${pnlHTML}
            <div style="margin-top:4px">${signBadgeHTML}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <button style="font-size:10px;padding:2px 7px;border-radius:5px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer;margin-bottom:4px;display:block;margin-left:auto" onclick="event.stopPropagation();updateOnePrice('${s.id}')">📡 更新</button>
            <div class="sc-current ${rc}">¥${currentPrice.toLocaleString()}</div>
            <div class="sc-rate ${rc}">${sign}${rate}%</div>
            <div style="font-size:10px;color:var(--muted);margin-top:4px">${isExpanded?'▲':'▼'}</div>
          </div>
        </div>
      </div>
      <!-- 注文中は常時表示（重要情報） -->
      ${pendingOrdersHTML ? `<div style="margin-top:8px">${pendingOrdersHTML}</div>` : ''}
      <!-- ▼ 折りたたみ部分 -->
      <div id="sc-body-${s.id}" style="display:${isExpanded?'block':'none'}">
        <div style="border-top:1px solid var(--border);margin:10px 0 10px"></div>
        <div class="sc-bars">
          <div class="sc-bar"><div class="sc-bar-label">購入価格</div><div class="sc-bar-val col-buy">¥${buyPrice.toLocaleString()}</div></div>
          <div class="sc-bar"><div class="sc-bar-label">目標価格</div><div class="sc-bar-val col-target">${s.target?'¥'+s.target.toLocaleString():'—'}</div></div>
          <div class="sc-bar"><div class="sc-bar-label">損切ライン</div><div class="sc-bar-val col-loss">${s.loss?'¥'+s.loss.toLocaleString():'—'}</div></div>
        </div>
        ${gaugeHTML}
        ${stockCode?`<div style="margin-bottom:8px">
          <button id="tv-btn-${s.id}" onclick="toggleChart('${s.id}')" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;text-align:left;font-family:inherit;transition:border-color .15s" onmouseover="this.style.borderColor='var(--blue)'" onmouseout="this.style.borderColor='var(--border)'">📊 チャートを表示 ▼</button>
          <div id="tv-${s.id}" style="display:none;margin-top:6px;border-radius:8px;overflow:hidden;background:#131722"></div>
        </div>`:''}
        ${fromDash && !s.condChecks?.length ? '<div style="font-size:11px;color:var(--blue);background:rgba(96,165,250,.07);border:1px dashed rgba(96,165,250,.3);border-radius:8px;padding:7px 10px;margin-bottom:8px">💡 5条件・目標価格・損切ラインを設定してください</div>' : ''}
        <span class="sc-judge ${jClass}">${jLabel}</span>
        <div class="sc-cond-mini">${condDots}</div>
        <div class="sc-footer" style="flex-direction:column;align-items:stretch;gap:6px;">
          <div class="sc-memo">${s.memo||''}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;align-items:center;">
            <button class="btn btn-sm" style="background:rgba(96,165,250,.15);color:var(--blue);border:1px solid rgba(96,165,250,.3);padding:5px 9px;font-size:11px;font-weight:600;border-radius:8px;cursor:pointer;" onclick="openAdjustModal('${s.id}')">🎯 目標・損切</button>
            <button class="btn btn-sm btn-ghost" onclick="showDetail('${s.id}')">詳細・編集</button>
            <button class="btn btn-sm" style="background:rgba(250,204,21,.15);color:var(--yellow);border:1px solid rgba(250,204,21,.3);padding:5px 10px;font-size:12px;font-weight:500;border-radius:8px;cursor:pointer;" onclick="openSettleModal('${s.id}')">決済</button>
            <button class="btn btn-sm btn-danger" style="padding:5px 8px;" onclick="deleteStock('${s.id}')">🗑</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('lastUpdate').textContent=new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  renderAllocation();
}

window._expandedCards = new Set();
window._expandedCands = new Set();
window.toggleCandExpand = (id) => {
  const body = document.getElementById('cand-body-' + id);
  if (!body) return;
  const isOpen = body.style.display !== 'none';
  if (isOpen) {
    window._expandedCands.delete(String(id));
    body.style.display = 'none';
    body.previousElementSibling.style.marginBottom = '0';
  } else {
    window._expandedCands.add(String(id));
    body.style.display = 'block';
    body.previousElementSibling.style.marginBottom = '10px';
  }
  // 矢印更新
  const card = body.closest('.stock-card');
  if (card) {
    const arrow = card.querySelector('[style*="▲"], [style*="▼"]');
    if (arrow) arrow.textContent = isOpen ? '▼' : '▲';
  }
};

function _getFxRates() {
  try { return JSON.parse(localStorage.getItem('portfolio_v6_fx') || '{}'); } catch(e) { return {}; }
}
function _toJPY(native, currency) {
  const fx = _getFxRates();
  if (currency === 'JPY') return native;
  if (currency === 'USD' && fx.USD) return native * fx.USD;
  if (currency === 'HKD' && fx.HKD) return native * fx.HKD;
  return null; // 為替未取得
}
function _currSym(cur) { return cur==='USD'?'$':cur==='HKD'?'HK$':'¥'; }

window.calcManualHistoryPL = () => {
  const buy = parseFloat(document.getElementById('mh-buy').value);
  const sell = parseFloat(document.getElementById('mh-sell').value);
  const qty = parseFloat(document.getElementById('mh-qty').value) || null;
  const cur = document.getElementById('mh-currency')?.value || 'JPY';
  const prev = document.getElementById('mh-pl-preview');
  if (!buy || !sell || buy <= 0 || sell <= 0) { prev.style.display='none'; return; }
  const pct = ((sell - buy) / buy * 100).toFixed(2);
  const isWin = sell >= buy;
  const sign = isWin ? '+' : '';
  const diffNative = (sell - buy) * (qty || 1);
  const diffJPY = _toJPY(diffNative, cur);
  const sym = _currSym(cur);
  let plStr = qty ? `${sign}${sym}${Math.abs((sell-buy)*qty).toLocaleString(undefined,{maximumFractionDigits:2})}` : '';
  if (diffJPY !== null && cur !== 'JPY' && qty) plStr += ` (${sign}¥${Math.round(Math.abs(diffJPY)).toLocaleString()})`;
  prev.style.display = 'block';
  prev.style.background = isWin ? 'rgba(74,222,154,.1)' : 'rgba(248,113,113,.1)';
  prev.style.color = isWin ? 'var(--green)' : 'var(--red)';
  prev.style.border = `1px solid ${isWin ? 'rgba(74,222,154,.3)' : 'rgba(248,113,113,.3)'}`;
  prev.textContent = `${isWin?'📈 利益':'📉 損失'}: ${sign}${pct}% ${plStr}`;
};
window.submitManualHistory = async () => {
  const name = document.getElementById('mh-name').value.trim();
  const code = document.getElementById('mh-code').value.trim();
  const sellDate = document.getElementById('mh-date').value;
  const qty = parseFloat(document.getElementById('mh-qty').value) || null;
  const buy = parseFloat(document.getElementById('mh-buy').value);
  const sell = parseFloat(document.getElementById('mh-sell').value);
  const cur = document.getElementById('mh-currency')?.value || 'JPY';
  const memo = document.getElementById('mh-memo').value.trim();
  const reason = document.querySelector('#mh-reason-btns .reason-btn.selected')?.dataset?.value || '';
  if (!name) { showToast('銘柄名を入力してください', true); return; }
  if (!buy || buy <= 0) { showToast('買値を入力してください', true); return; }
  if (!sell || sell <= 0) { showToast('売値を入力してください', true); return; }
  const plPct = ((sell - buy) / buy * 100).toFixed(2);
  const plNative = qty ? (sell - buy) * qty : null;
  const plYen = plNative !== null ? (_toJPY(plNative, cur) !== null ? Math.round(_toJPY(plNative, cur)) : Math.round(plNative)) : null;
  const id = 'manual_' + Date.now();
  const historyItem = {
    id, name, code, qty, buy, currency: cur, sellPrice: sell, sellDate,
    sellReason: reason, sellMemo: memo,
    plPct: parseFloat(plPct), plYen,
    settledAt: Date.now(), manualEntry: true
  };
  await setDoc(doc(db, 'history', id), historyItem);
  window.closeManualHistoryModal();
  showToast(`✅ 履歴に追加: ${name} ${parseFloat(plPct)>=0?'+':''}${plPct}%`);
};
window.deleteManualHistory = async (id) => {
  if (!confirm('この履歴を削除しますか？')) return;
  await deleteDoc(doc(db, 'history', id));
  showToast('🗑 履歴を削除しました');
};
// ── ライン変更履歴 編集・削除 ──
window.editAdjEntry = (sid, idx) => {
  document.getElementById(`adj-view-${sid}-${idx}`).style.display = 'none';
  document.getElementById(`adj-edit-${sid}-${idx}`).style.display = 'block';
};
window.cancelAdjEdit = (sid, idx) => {
  document.getElementById(`adj-view-${sid}-${idx}`).style.display = 'block';
  document.getElementById(`adj-edit-${sid}-${idx}`).style.display = 'none';
};
window.saveAdjEntry = async (sid, idx) => {
  const s = stocks.find(s => String(s.id) === String(sid)); if (!s) return;
  const newTgt = parseFloat(document.getElementById(`adj-tgt-${sid}-${idx}`)?.value) || null;
  const newLos = parseFloat(document.getElementById(`adj-los-${sid}-${idx}`)?.value) || null;
  s.adjustments[idx].newTarget = newTgt;
  s.adjustments[idx].newLoss   = newLos;
  // 最新エントリなら現在の目標・損切も更新する
  if (idx === s.adjustments.length - 1) {
    if (newTgt) s.target = newTgt;
    if (newLos) s.loss   = newLos;
  }
  await saveStock(s);
  showToast('✅ ライン変更履歴を修正しました');
  showDetail(sid); // 詳細モーダルを再描画
};
window.deleteAdjEntry = async (sid, idx) => {
  if (!confirm('この履歴を削除しますか？')) return;
  const s = stocks.find(s => String(s.id) === String(sid)); if (!s) return;
  const wasLatest = idx === s.adjustments.length - 1;
  s.adjustments.splice(idx, 1);
  // 最新エントリを消した場合、1つ前の値を現在のライン設定として復元
  if (wasLatest && s.adjustments.length > 0) {
    const prev = s.adjustments[s.adjustments.length - 1];
    if (confirm('最新の変更を削除しました。ラインを直前の値（目標¥' + (prev.newTarget||0).toLocaleString() + ' / 損切¥' + (prev.newLoss||0).toLocaleString() + '）に戻しますか？')) {
      if (prev.newTarget) s.target = prev.newTarget;
      if (prev.newLoss)   s.loss   = prev.newLoss;
    }
  }
  await saveStock(s);
  showToast('🗑 履歴を削除しました');
  showDetail(sid);
};

    const plPct = ((sell - buy) / buy * 100).toFixed(2);

let toastTimer;
function showToast(msg,isErr=false){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.className='toast show'+(isErr?' err':'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}
window.showToast=showToast;

function renderAllocation() {
  const el = document.getElementById('allocation-section');
  if (!el) return;

  // ダッシュボードと同じlocalStorageキーを読む（同一オリジン共有）
  let hlds = [], tgts = {}, fx = {};
  try { const d=localStorage.getItem('portfolio_v6');         if(d) hlds=JSON.parse(d); } catch(e){}
  try { const d=localStorage.getItem('portfolio_v6_targets'); if(d) tgts=JSON.parse(d); } catch(e){}
  try { const d=localStorage.getItem('portfolio_v6_fx');      if(d) fx=JSON.parse(d);   } catch(e){}

  if (!hlds.length) { el.style.display='none'; return; }

  // 円換算（dashboard.html の getValJPY と同ロジック）
  function getValJPY(h) {
    let price = parseFloat(h.price)||0;
    if(!price && h.currency && fx[h.currency]) price = fx[h.currency];
    const qty = parseFloat(h.qty)||0;
    const raw = price * qty;
    const val = (h.isToushin || String(h.category||'').startsWith('投信')) ? raw/10000 : raw;
    const cur = (h.currency||'JPY').toUpperCase();
    if(cur==='JPY') return val;
    if(cur==='USD' && fx.USD) return val*fx.USD;
    if(cur==='HKD' && fx.HKD) return val*fx.HKD;
    return val;
  }

  const totalJPY  = hlds.reduce((s,h) => s + getValJPY(h), 0);
  const cashHlds  = hlds.filter(h => h.category === '現金');
  if (!cashHlds.length || totalJPY <= 0) { el.style.display='none'; return; }

  // 通貨でグループ化
  const curMap = {};
  for (const h of cashHlds) {
    const cur = (h.currency||'JPY').toUpperCase();
    if (!curMap[cur]) curMap[cur] = { cur, jpy:0, accounts:[] };
    curMap[cur].jpy += getValJPY(h);
    if (h.name) curMap[cur].accounts.push(h.name);
  }
  const curList   = Object.values(curMap).sort((a,b) => b.jpy - a.jpy);
  const totalCash = curList.reduce((s,c) => s + c.jpy, 0);

  const cashTgtPct = tgts['現金'] || 0;
  const idealCash  = cashTgtPct > 0 ? totalJPY * cashTgtPct / 100 : 0;
  const excess     = totalCash - idealCash;

  function fmtJPY(v) { return '¥ ' + Math.round(Math.abs(v)).toLocaleString(); }

  // サマリーボックス
  const exColor = excess >= 0 ? 'var(--red)' : 'var(--blue)';
  const exLabel = excess >= 0
    ? `<span style="color:var(--red);font-weight:700">${fmtJPY(excess)} 過剰</span>`
    : `<span style="color:var(--blue);font-weight:700">${fmtJPY(excess)} 不足</span>`;
  const summaryHTML = cashTgtPct > 0 ? `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px;background:var(--surface2);border-radius:10px;margin-bottom:12px">
      <div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:3px">現在の現金合計</div>
        <div style="font-size:15px;font-weight:700">${fmtJPY(totalCash)}</div>
        <div style="font-size:10px;color:var(--muted)">総資産の${(totalCash/totalJPY*100).toFixed(1)}%</div>
      </div>
      <div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:3px">目標額（${cashTgtPct}%）</div>
        <div style="font-size:15px;font-weight:700;color:var(--muted)">${fmtJPY(idealCash)}</div>
      </div>
      <div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:3px">差額</div>
        <div style="font-size:14px">${exLabel}</div>
        <div style="font-size:10px;color:var(--muted)">${excess>=0?'↓ 各通貨の按分参照':'↑ 資金確保を検討'}</div>
      </div>
    </div>` : `<div style="font-size:11px;color:var(--muted);margin-bottom:10px">ダッシュボードで現金の目標%を設定すると余剰が計算されます</div>`;

  // 通貨別行
  const curRows = curList.map(c => {
    const share    = totalCash > 0 ? c.jpy / totalCash : 0;
    const myExcess = excess * share;
    const remain   = c.jpy - myExcess;
    const curLabel = c.cur==='JPY'?'🇯🇵 日本円':c.cur==='USD'?'🇺🇸 米ドル':c.cur==='HKD'?'🇭🇰 香港ドル':c.cur;
    const accStr   = c.accounts.length ? `（${c.accounts[0]}）` : '';
    const exC      = myExcess >= 0 ? 'var(--red)' : 'var(--blue)';
    const exTxt    = myExcess >= 0
      ? `▼ ${fmtJPY(myExcess)} 投資へ`
      : `▲ ${fmtJPY(myExcess)} 不足`;
    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:8px 6px">
        <div style="font-size:12px;font-weight:600">${curLabel}</div>
        <div style="font-size:10px;color:var(--muted)">${accStr}</div>
      </td>
      <td style="padding:8px 6px;text-align:right;font-size:13px;font-weight:600">${fmtJPY(c.jpy)}</td>
      <td style="padding:8px 6px;text-align:right;font-size:11px;color:var(--muted)">${(share*100).toFixed(1)}%</td>
      <td style="padding:8px 6px;text-align:right;font-size:12px;font-weight:600;color:${exC}">${exTxt}</td>
      <td style="padding:8px 6px;text-align:right;font-size:12px;color:var(--muted)">${fmtJPY(remain)}</td>
    </tr>`;
  }).join('');

  el.style.display = '';
  el.innerHTML = `
    <div class="card" style="margin-bottom:90px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-title" style="margin-bottom:0">💴 待機資金 <span style="font-size:10px;font-weight:400;color:var(--muted)">通貨別まとめ</span></div>
        <div style="font-size:13px;font-weight:600">${fmtJPY(totalCash)}</div>
      </div>
      ${summaryHTML}
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:340px">
          <thead>
            <tr style="border-bottom:2px solid var(--border)">
              <th style="padding:4px 6px;font-size:10px;color:var(--muted);text-align:left;font-weight:600">通貨</th>
              <th style="padding:4px 6px;font-size:10px;color:var(--muted);text-align:right;font-weight:600">現在残高(円換算)</th>
              <th style="padding:4px 6px;font-size:10px;color:var(--muted);text-align:right;font-weight:600">現金内比率</th>
              <th style="padding:4px 6px;font-size:10px;color:var(--muted);text-align:right;font-weight:600">投資へ回す目安</th>
              <th style="padding:4px 6px;font-size:10px;color:var(--muted);text-align:right;font-weight:600">目標後の残高</th>
            </tr>
          </thead>
          <tbody>${curRows}</tbody>
        </table>
      </div>
    </div>`;
}

</script>
