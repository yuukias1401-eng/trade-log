<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トレードログ</title>
<style>
:root {
  --bg:#0d0f14; --surface:#161921; --surface2:#1e2230; --surface3:#252a3a;
  --border:#2a2f3e; --text:#e8eaf0; --muted:#6b7185;
  --green:#4ade9a; --blue:#60a5fa; --red:#f87171; --yellow:#facc15; --purple:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;}
header h1{font-size:1.1rem;font-weight:700;color:var(--green);}
.header-right{display:flex;align-items:center;gap:10px;}
header span{font-size:11px;color:var(--muted);}
.sync-status{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:500;}
.sync-ok{color:var(--green);background:rgba(74,222,154,.1);}
.sync-err{color:var(--red);background:rgba(248,113,113,.1);}
.sync-ing{color:var(--yellow);background:rgba(250,204,21,.1);}

.container{max-width:640px;margin:0 auto;padding:16px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:14px;}

.row{display:grid;gap:10px;margin-bottom:10px;}
.row2{grid-template-columns:1fr 1fr;}
.row3{grid-template-columns:1fr 1fr 1fr;}
.row1{grid-template-columns:1fr;}

.fg{display:flex;flex-direction:column;gap:4px;}
label{font-size:11px;color:var(--muted);}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--text);font-size:14px;width:100%;outline:none;transition:border-color .15s;font-family:inherit;}
input:focus,select:focus,textarea:focus{border-color:var(--blue);}
input::placeholder{color:#374151;}
textarea{resize:vertical;min-height:52px;}

input.auto-filled{border-color:var(--purple);background:rgba(167,139,250,.08);}

.judgment{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-weight:600;font-size:15px;}
.judgment.green{background:rgba(74,222,154,.1);border:1px solid rgba(74,222,154,.3);color:var(--green);}
.judgment.yellow{background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.3);color:var(--yellow);}
.judgment.red{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red);}
.judgment.none{background:var(--surface2);border:1px solid var(--border);color:var(--muted);}

.cond-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.cond-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);cursor:pointer;transition:border-color .15s;}
.cond-item:hover{border-color:var(--blue);}
.cond-item.checked{border-color:var(--green);background:rgba(74,222,154,.07);}
.cond-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);cursor:pointer;flex-shrink:0;margin-top:2px;}
.cond-body{flex:1;}
.cond-name{font-size:13px;font-weight:500;margin-bottom:2px;}
.cond-desc{font-size:11px;color:var(--muted);}
.cond-note{display:block;margin-top:5px;}
.cond-note input{font-size:12px;padding:5px 8px;background:var(--surface3);}

.bonus-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.bonus-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface2);border-radius:8px;border:1px solid var(--border);cursor:pointer;}
.bonus-item:hover{border-color:var(--purple);}
.bonus-item.checked{border-color:var(--purple);background:rgba(167,139,250,.07);}
.bonus-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--purple);cursor:pointer;flex-shrink:0;}
.bonus-label{font-size:12px;}

.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}

.btn{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s;font-family:inherit;}
.btn-primary{background:var(--green);color:#0d0f14;width:100%;margin-top:6px;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-sm{padding:5px 11px;font-size:12px;font-weight:500;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue);}
.btn-danger{background:transparent;border:1px solid transparent;color:var(--muted);}
.btn-danger:hover{color:var(--red);border-color:var(--red);}
.btn-price{background:var(--surface2);border:1px solid var(--border);color:var(--muted);}
.btn-price:hover{border-color:var(--blue);color:var(--blue);}

.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.list-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}

.stock-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;}
.stock-card:hover{border-color:var(--surface3);}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.sc-name{font-size:15px;font-weight:700;}
.sc-code{font-size:11px;color:var(--muted);margin-top:2px;}
.sc-price-block{text-align:right;}
.sc-current{font-size:18px;font-weight:700;}
.sc-rate{font-size:12px;font-weight:600;margin-top:2px;}
.up{color:var(--green);}
.down{color:var(--red);}
.flat{color:var(--muted);}

.sc-bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.sc-bar{background:var(--surface2);border-radius:8px;padding:7px 10px;text-align:center;}
.sc-bar-label{font-size:10px;color:var(--muted);margin-bottom:2px;}
.sc-bar-val{font-size:12px;font-weight:600;}
.col-buy{color:var(--muted);}
.col-target{color:var(--blue);}
.col-loss{color:var(--red);}

/* ── ゲージバー ── */
.gauge-wrap{margin-bottom:10px;}
.gauge-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px;}
.gauge-track{height:8px;background:var(--surface2);border-radius:4px;position:relative;overflow:visible;}
.gauge-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--green));position:absolute;left:0;}
.gauge-marker{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:white;transform:translateX(-50%);}
.gauge-remain{display:flex;justify-content:space-between;margin-top:5px;}
.gauge-remain span{font-size:11px;font-weight:600;}
.alert-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:8px;animation:pulse 1s infinite;}
.alert-win{background:rgba(74,222,154,.2);color:var(--green);border:1px solid var(--green);}
.alert-lose{background:rgba(248,113,113,.2);color:var(--red);border:1px solid var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

.sc-judge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:8px;}
.sc-judge.green{background:rgba(74,222,154,.15);color:var(--green);}
.sc-judge.yellow{background:rgba(250,204,21,.15);color:var(--yellow);}
.sc-judge.red{background:rgba(248,113,113,.15);color:var(--red);}
.sc-judge.none{background:var(--surface2);color:var(--muted);}

.sc-cond-mini{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;}
.cond-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.cond-dot.on{background:var(--green);}
.cond-dot.off{background:var(--border);}

.sc-footer{display:flex;justify-content:space-between;align-items:center;}
.sc-memo{font-size:11px;color:var(--muted);flex:1;}
.sc-btns{display:flex;gap:6px;}

.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13px;}
.empty .icon{font-size:2rem;margin-bottom:10px;}

.toast{position:fixed;bottom:20px;right:20px;background:var(--surface2);border:1px solid var(--green);color:var(--green);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.err{border-color:var(--red);color:var(--red);}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;}
.modal.open{display:flex;}
.modal-inner{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;width:100%;max-width:560px;margin:auto;}
.modal-title{font-size:15px;font-weight:700;margin-bottom:18px;color:var(--green);}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--green);color:#0d0f14;border:none;font-size:28px;font-weight:700;cursor:pointer;z-index:150;box-shadow:0 4px 16px rgba(74,222,154,.4);transition:transform .15s,filter .15s;display:flex;align-items:center;justify-content:center;}
.fab:hover{transform:scale(1.08);filter:brightness(1.1);}

@media(max-width:420px){
  .row3{grid-template-columns:1fr 1fr;}
  .sc-bars{grid-template-columns:1fr 1fr;}
}

/* ── タブ ── */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:90;}
.tab-btn{flex:1;padding:11px 6px;font-size:12px;font-weight:600;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;transition:all .15s;}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);}

/* ── 履歴カード ── */
.hist-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;}

/* ── 統計 ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;}
.stat-label{font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;}
.stat-value{font-size:22px;font-weight:700;}
.stat-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.summary-row:last-child{border-bottom:none;}

/* ── 引き上げ履歴 ── */
.adj-item{display:flex;flex-direction:column;gap:3px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
.adj-item:last-child{border-bottom:none;}

/* ── 決済理由ボタン ── */
.reason-btn{padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit;line-height:1.4;}
.reason-btn:hover{border-color:var(--blue);color:var(--text);}
.reason-btn.selected{background:rgba(96,165,250,.2);border-color:var(--blue);color:var(--blue);font-weight:700;}
</style>
</head>
<body>

<header>
  <h1>📈 トレードログ</h1>
  <div class="header-right">
    <span class="sync-status sync-ing" id="syncStatus">⏳ 接続中...</span>
    <span id="userInfo" style="font-size:10px;color:var(--muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle"></span>
    <button onclick="googleSignOut()" style="font-size:10px;padding:3px 8px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer" title="ログアウト">🚪</button>
    <a href="dashboard.html" class="btn btn-sm btn-ghost" style="font-size:11px;padding:4px 10px;text-decoration:none">📊 ダッシュボード</a>
    <button class="btn btn-sm btn-ghost" onclick="document.getElementById('importFile').click()" style="font-size:11px;padding:4px 10px;">📥 インポート</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importFromFile(this)">
    <span id="lastUpdate"></span>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn"        id="tab-btn-candidates" onclick="switchTab('candidates')">📋 候補</button>
  <button class="tab-btn active" id="tab-btn-watch"      onclick="switchTab('watch')">📈 ウォッチ</button>
  <button class="tab-btn"        id="tab-btn-history"    onclick="switchTab('history')">📋 履歴</button>
  <button class="tab-btn"        id="tab-btn-stats"      onclick="switchTab('stats')">📊 統計</button>
</nav>

<div class="container" id="tab-candidates" style="display:none">
  <div class="list-header">
    <div class="list-title">候補リスト</div>
  </div>
  <div id="candidateslist"></div>
  <div id="rejected-section" style="margin-top:12px">
    <button onclick="toggleRejectedSection()" id="rejected-toggle-btn" style="width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">見送り履歴 (0件) ▼</button>
    <div id="rejectedlist" style="display:none;margin-top:8px"></div>
  </div>
</div>

<div class="container" id="tab-watch">
  <div class="list-header">
    <div class="list-title">ウォッチリスト</div>
    <div style="display:flex;gap:6px;align-items:center">
      <select id="sortSelect" onchange="render()" style="font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 6px;color:var(--muted);font-family:inherit;cursor:pointer">
        <option value="signal">🚨 売りサイン優先</option>
        <option value="created">追加順</option>
        <option value="name">銘柄名順</option>
        <option value="pnl_desc">損益額 大↑</option>
        <option value="pnl_asc">損益額 小↓</option>
        <option value="rate_desc">損益率 高↑</option>
        <option value="rate_asc">損益率 低↓</option>
      </select>
      <button class="btn btn-sm btn-ghost" onclick="updateAllPrices()">📡 一括更新</button>
    </div>
  </div>
  <div id="watchlist"></div>
  <div id="allocation-section" style="display:none"></div>
</div>

<div class="container" id="tab-history" style="display:none">
  <div class="list-header">
    <div class="list-title">決済履歴</div>
    <button class="btn btn-sm btn-ghost" onclick="openManualHistoryModal()" style="font-size:11px;padding:4px 10px">📝 手動で追加</button>
  </div>
  <div id="historylist"></div>
</div>

<div class="container" id="tab-stats" style="display:none">
  <div id="statsview"></div>
</div>

<!-- 銘柄追加モーダル -->
<div class="modal" id="addModal">
  <div class="modal-inner">
    <div class="modal-title">＋ 銘柄を追加</div>
    <div class="row row2">
      <div class="fg"><label>銘柄コード</label><input id="f-code" placeholder="例: 7203"></div>
      <div class="fg"><label>銘柄名 *</label><input id="f-name" placeholder="例: トヨタ"></div>
    </div>
    <div class="row row2">
      <div class="fg"><label>購入日</label><input id="f-date" type="text" inputmode="numeric" placeholder="例: 20260525" oninput="_formatDateLive(this)"></div>
      <div class="fg"><label>株数</label><input id="f-qty" type="number" placeholder="100"></div>
    </div>
    <div class="row row3">
      <div class="fg">
        <label>購入価格 (円) *</label>
        <input id="f-buy" type="number" placeholder="3500" oninput="autoFill(this.value)">
      </div>
      <div class="fg">
        <label>目標価格 (円)</label>
        <input id="f-target" type="number" placeholder="自動入力" class="auto-filled">
      </div>
      <div class="fg">
        <label>損切ライン (円)</label>
        <input id="f-loss" type="number" placeholder="自動入力" class="auto-filled">
      </div>
    </div>

    <div class="section-label" style="margin-top:4px">押し目買い 5条件</div>
    <div id="judgment-badge" class="judgment none">
      <span id="judgment-emoji">—</span>
      <span id="judgment-text">チェックを入れると判定が出ます</span>
    </div>
    <div class="cond-list">
      <label class="cond-item" id="cond0-wrap">
        <input type="checkbox" id="cond0" onchange="updateJudgment()">
        <div class="cond-body">
          <div class="cond-name">① 上昇トレンド確認</div>
          <div class="cond-desc">日足で75日線が上向き、株価が75日線の上にある</div>
          <span class="cond-note"><input id="cond0-note" placeholder="具体値メモ（任意）"></span>
        </div>
      </label>
      <label class="cond-item" id="cond1-wrap">
        <input type="checkbox" id="cond1" onchange="updateJudgment()">
        <div class="cond-body">
          <div class="cond-name">② 押し目が来ている</div>
          <div class="cond-desc">直近高値から5〜15%下落、25日線付近まで下がってきた</div>
          <span class="cond-note"><input id="cond1-note" placeholder="例: 高値5200円から-8%、25日線4790円付近"></span>
        </div>
      </label>
      <label class="cond-item" id="cond2-wrap">
        <input type="checkbox" id="cond2" onchange="updateJudgment()">
        <div class="cond-body">
          <div class="cond-name">③ 反転サイン</div>
          <div class="cond-desc">陽線が1〜3本出た＋その日の出来高が平均より増加</div>
          <span class="cond-note"><input id="cond2-note" placeholder="例: 陽線2本、出来高1.3倍"></span>
        </div>
      </label>
      <label class="cond-item" id="cond3-wrap">
        <input type="checkbox" id="cond3" onchange="updateJudgment()">
        <div class="cond-body">
          <div class="cond-name">④ 過熱していない</div>
          <div class="cond-desc">RSI 70以下（強いトレンド中は80以上で注意に緩めてもOK）</div>
          <span class="cond-note"><input id="cond3-note" placeholder="例: RSI 58"></span>
        </div>
      </label>
      <label class="cond-item" id="cond4-wrap">
        <input type="checkbox" id="cond4" onchange="updateJudgment()">
        <div class="cond-body">
          <div class="cond-name">⑤ 相場環境が良い</div>
          <div class="cond-desc">VIX 20以下</div>
          <span class="cond-note"><input id="cond4-note" placeholder="例: VIX 17.2"></span>
        </div>
      </label>
    </div>

    <div class="section-label">加点条件</div>
    <div class="bonus-list">
      <label class="bonus-item" id="bonus0-wrap">
        <input type="checkbox" id="bonus0" onchange="toggleBonus(0)">
        <span class="bonus-label">直近決算が予想超え</span>
      </label>
      <label class="bonus-item" id="bonus1-wrap">
        <input type="checkbox" id="bonus1" onchange="toggleBonus(1)">
        <span class="bonus-label">明確な材料・テーマがある</span>
      </label>
      <label class="bonus-item" id="bonus2-wrap">
        <input type="checkbox" id="bonus2" onchange="toggleBonus(2)">
        <span class="bonus-label">出来高が20日平均の1.5倍以上</span>
      </label>
      <label class="bonus-item" id="bonus3-wrap">
        <input type="checkbox" id="bonus3" onchange="toggleBonus(3)">
        <span class="bonus-label">⚠️ 決算発表の2週間前後を避ける（確認済み）</span>
      </label>
    </div>

    <div class="row row1">
      <div class="fg"><label>一言メモ（任意）</label><input id="f-memo" placeholder="例: 決算前の押し目買い、出来高増加中"></div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-sm btn-ghost" onclick="closeAddModal()">キャンセル</button>
      <button class="btn btn-primary" style="width:auto;padding:10px 24px;" onclick="addStock()">追加する</button>
    </div>
  </div>
</div>

<!-- 決済モーダル -->
<div class="modal" id="settleModal">
  <div class="modal-inner">
    <div class="modal-title">💰 決済</div>
    <div id="settle-stock-info" style="background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px;"></div>
    <!-- 注文種別 -->
    <div style="margin-bottom:14px">
      <div style="font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px">注文種別</div>
      <div id="s-type-btns" style="display:flex;gap:8px;">
        <button type="button" class="reason-btn selected" data-type="成行き" onclick="onOrderTypeChange(this)">📊 成行き</button>

<div id="loginOverlay" style="display:flex;position:fixed;inset:0;z-index:9999;background:rgba(13,15,20,.97);flex-direction:column;align-items:center;justify-content:center;gap:20px;">
  <div style="font-size:3rem">📈</div>
  <div style="font-size:1.3rem;font-weight:700;color:#4ade9a">トレードログ</div>
  <div style="color:#6b7185;font-size:13px;text-align:center;max-width:260px;line-height:1.6">Googleアカウントでログインして<br>データを同期してください</div>
  <button onclick="googleSignIn()" style="background:#4ade9a;color:#0d0f14;border:none;border-radius:8px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer">
    🔑 Googleでログイン
  </button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA1DGiJ6TShj6ZI5_j-vkR5gSKsxEfUwqA",
  authDomain: "trade-log-c20dd.firebaseapp.com",
  projectId: "trade-log-c20dd",
  storageBucket: "trade-log-c20dd.firebasestorage.app",
  messagingSenderId: "604201650756",
  appId: "1:604201650756:web:65219ae816bac1e1574a11"
};

const app = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const stocksCol      = collection(db, 'watchlist');
const historyCol     = collection(db, 'history');
const candidatesCol  = collection(db, 'candidates');

let stocks  = [];
let history = [];
let candidates = [];
let _unsubStocks      = null;
let _unsubHistory     = null;
let _unsubPortfolio   = null;
let _unsubCandidates  = null;
let _candLocalUpdate  = false;
let _buyingCandId     = null;
let _rejectingCandId  = null;

function setSyncStatus(state) {
  const el = document.getElementById('syncStatus');
  if(state==='ok')    { el.textContent='☁️ 同期済み';  el.className='sync-status sync-ok'; }
  if(state==='ing')   { el.textContent='⏳ 同期中...'; el.className='sync-status sync-ing'; }
  if(state==='err')   { el.textContent='❌ オフライン'; el.className='sync-status sync-err'; }
  if(state==='login') { el.textContent='🔒 未ログイン'; el.className='sync-status sync-err'; }
}

// Google認証
window.googleSignIn  = () => signInWithPopup(auth, provider).catch(e => console.error('login error', e));
window.googleSignOut = () => signOut(auth);

// 認証状態を監視してからFirestoreを開始
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('loginOverlay').style.display = 'none';
    const ui = document.getElementById('userInfo');
    if(ui) ui.textContent = user.displayName || user.email || '';
    // リアルタイム同期開始
    if (!_unsubStocks) {
      _unsubStocks = onSnapshot(stocksCol, (snapshot) => {
        stocks = snapshot.docs.map(d => ({ id: d.id, ...d.data() })); // settled含む全件（カード側でバナー表示）
        stocks.sort((a, b) => (a.createdAt||0) - (b.createdAt||0));
        render();
        setSyncStatus('ok');
      }, () => setSyncStatus('err'));
    }
    if (!_unsubHistory) {
      _unsubHistory = onSnapshot(historyCol, (snapshot) => {
        history = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        history.sort((a, b) => (b.settledAt||0) - (a.settledAt||0));
        renderHistory();
        renderStats();
      });
    }
    // 待機資金用：ダッシュボードの保有資産（users/{uid}/holdings）をFirestoreから直接購読
    // → localStorage 依存をやめ、別デバイス・別タブの更新もリアルタイム反映
    if (!_unsubCandidates) {
      _unsubCandidates = onSnapshot(candidatesCol, (snapshot) => {
        candidates = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        candidates.sort((a, b) => (b.addedAt||0) - (a.addedAt||0));
        if (_candLocalUpdate) return;
        if (activeTab === 'candidates') renderCandidates();
      }, (e) => console.warn('[candidates]', e));
    }
    if (!_unsubPortfolio) {
      const uref    = doc(db, 'users', user.uid);
      const holdCol = collection(db, 'users', user.uid, 'holdings');
      _unsubPortfolio = onSnapshot(holdCol, async (snap) => {
        const hlds = snap.docs.map(d => d.data());
        if (!hlds.length) { renderAllocation(); return; }
        try { localStorage.setItem('portfolio_v6', JSON.stringify(hlds)); } catch(e){}
        try {
          const ms = await getDoc(uref);
          if (ms.exists()) {
            const meta = ms.data();
            if (meta.fxRates)     localStorage.setItem('portfolio_v6_fx',      JSON.stringify(meta.fxRates));
            if (meta.targetAlloc) localStorage.setItem('portfolio_v6_targets', JSON.stringify(meta.targetAlloc));
          }
        } catch(e){ console.warn('[portfolio meta]', e); }
        renderAllocation();
      }, (e) => console.warn('[portfolio]', e));
    }
  } else {
    document.getElementById('loginOverlay').style.display = 'flex';
    setSyncStatus('login');
    if (_unsubStocks)      { _unsubStocks();      _unsubStocks      = null; }
    if (_unsubHistory)     { _unsubHistory();     _unsubHistory     = null; }
    if (_unsubPortfolio)   { _unsubPortfolio();   _unsubPortfolio   = null; }
    if (_unsubCandidates)  { _unsubCandidates();  _unsubCandidates  = null; }
    stocks = []; history = []; candidates = [];
    render(); renderHistory(); renderStats(); renderCandidates();
  }
});

let activeTab = 'watch';
window.switchTab = (tab) => {
  activeTab = tab;
  ['candidates','watch','history','stats'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t===tab ? '' : 'none';
    document.getElementById('tab-btn-'+t).classList.toggle('active', t===tab);
  });
  const fab = document.getElementById('fabBtn');
  if (fab) fab.style.display = (tab==='watch'||tab==='candidates') ? '' : 'none';
  if(tab==='history') renderHistory();
  if(tab==='stats') renderStats();
  if(tab==='candidates') renderCandidates();
};

async function saveStock(s) {
  setSyncStatus('ing');
  await setDoc(doc(db, 'watchlist', String(s.id)), s);
}
async function removeStock(id) {
  setSyncStatus('ing');
  const s = stocks.find(s => String(s.id) === String(id));
  if (s && s.fromDashboard) {
    // ダッシュボード由来の銘柄は削除せず settled フラグを立てる
    // （削除するとダッシュボード同期で復活してしまうため）
    // settledCost を記録しておく（将来の再購入時に「新しい取引か」を判定するため）
    await setDoc(doc(db, 'watchlist', String(id)), { id: String(id), settled: true, settledAt: Date.now(), settledCost: s.buy ?? s.cost ?? null });
  } else {
    await deleteDoc(doc(db, 'watchlist', String(id)));
  }
}

window.addStock = async () => {
  const name=document.getElementById('f-name').value.trim();
  const buy=parseFloat(document.getElementById('f-buy').value);
  if(!name){ showToast('銘柄名を入力してください',true); return; }
  if(isNaN(buy)||buy<=0){ showToast('購入価格を入力してください',true); return; }
  const condChecks=[0,1,2,3,4].map(i=>document.getElementById('cond'+i).checked);
  const condNotes=[0,1,2,3,4].map(i=>document.getElementById('cond'+i+'-note').value.trim());
  const bonusChecks=[0,1,2,3].map(i=>document.getElementById('bonus'+i).checked);
  const checkedCount=condChecks.filter(Boolean).length;
  const s={
    id: Date.now(), createdAt: Date.now(),
    code: document.getElementById('f-code').value.trim(), name,
    buyDate: window._isValidDate(document.getElementById('f-date').value) ? document.getElementById('f-date').value : '',
    qty: parseFloat(document.getElementById('f-qty').value)||null,
    buy, target: parseFloat(document.getElementById('f-target').value)||null,
    loss: parseFloat(document.getElementById('f-loss').value)||null,
    current: buy, memo: document.getElementById('f-memo').value.trim(),
    condChecks, condNotes, bonusChecks, checkedCount,
    judgment: checkedCount===5?'green':checkedCount>=3?'yellow':'red',
    updatedAt: new Date().toLocaleString('ja-JP')
  };
  await saveStock(s);
  resetForm(); window.closeAddModal();
  showToast('✅ 追加しました（クラウドに保存）');
};

function resetForm() {
  ['f-code','f-name','f-qty','f-buy','f-target','f-loss','f-memo'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-date').value=new Date().toISOString().slice(0,10);
  [0,1,2,3,4].forEach(i=>{ document.getElementById('cond'+i).checked=false; document.getElementById('cond'+i+'-note').value=''; document.getElementById('cond'+i+'-wrap').classList.remove('checked'); });
  [0,1,2,3].forEach(i=>{ document.getElementById('bonus'+i).checked=false; document.getElementById('bonus'+i+'-wrap').classList.remove('checked'); });
  document.getElementById('judgment-badge').className='judgment none';
  document.getElementById('judgment-emoji').textContent='—';
  document.getElementById('judgment-text').textContent='チェックを入れると判定が出ます';
}

window.promptPrice = async (id) => {
  const s=stocks.find(s=>String(s.id)===String(id));
  const val=prompt(`${s.name}\n現在値を入力してください`,s.current);
  if(val===null) return;
  const price=parseFloat(val);
  if(isNaN(price)||price<=0){ showToast('正しい価格を入力してください',true); return; }
  s.current=price; s.updatedAt=new Date().toLocaleString('ja-JP');
  await saveStock(s);
  showToast(`✅ ${s.name} を ¥${price.toLocaleString()} に更新`);
};

// 日付入力ヘルパー: 数字だけ打つと YYYY-MM-DD にリアルタイム整形
window._formatDateLive = (el) => {
  let v = el.value.replace(/\D/g, '').slice(0, 8);
  if (v.length > 6)      v = v.slice(0,4) + '-' + v.slice(4,6) + '-' + v.slice(6);
  else if (v.length > 4) v = v.slice(0,4) + '-' + v.slice(4);
  el.value = v;
};
// YYYY-MM-DD の妥当性チェック（年2000〜2100, 月01〜12, 日01〜31）
window._isValidDate = (str) => {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(str)) return false;
  const [y, m, d] = str.split('-').map(Number);
  return y >= 2000 && y <= 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31;
};

window.setBuyDate = async (id, val) => {
  if (val && !window._isValidDate(val)) {
    showToast('日付の形式が正しくありません（例: 2026-05-25）', true);
    return;
  }
  const s=stocks.find(s=>String(s.id)===String(id));
  if(!s) return;
  s.buyDate = val || '';
  s.updatedAt = new Date().toLocaleString('ja-JP');
  await saveStock(s);
  showToast(val ? `📅 購入日を ${val} に設定` : '📅 購入日をクリアしました');
};

const PROXIES=[u=>u, u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`, u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`, u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`, u=>`https://thingproxy.freeboard.io/fetch/${u}`];

async function fetchWithTimeout(url,ms=8000){
  const ctrl=new AbortController(); const tid=setTimeout(()=>ctrl.abort(),ms);
  try{ const res=await fetch(url,{signal:ctrl.signal}); clearTimeout(tid); return res; }
  catch(e){ clearTimeout(tid); throw e; }
}

async function fetchYahooPrice(code, currency){
  if(!code) return null;
  // サフィックスあり（0700.HK / AAPL 等）はそのまま。4-5桁数字は通貨で取引所を確定（競争させない）
  let syms;
  if(/\./.test(code)){
    syms=[code];
  } else if(/^\d{4,5}$/.test(code)){
    // 通貨で単一シンボルに確定: HKD→.HK / それ以外(JPY等)→.T
    syms = [(currency==='HKD') ? code+'.HK' : code+'.T'];
  } else {
    syms=[code];
  }
  const cb=Date.now();
  const attempts=[];
  for(const sym of syms)
    for(const ep of [`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=1d&_=${cb}`,`https://query2.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=1d&_=${cb}`])
      for(const mkProxy of PROXIES)
        attempts.push(fetchWithTimeout(mkProxy(ep)).then(r=>{if(!r.ok)throw 0;return r.json();}).then(data=>{const parsed=typeof data==='string'?JSON.parse(data):data;const price=parsed?.chart?.result?.[0]?.meta?.regularMarketPrice;if(price&&price>0)return price;throw 0;}));
  try{ return await Promise.any(attempts); }catch(e){ return null; }
}

window.updateAllPrices = async () => {
  const targets=stocks.filter(s=>s.code);
  if(!targets.length){ showToast('銘柄コードが登録された銘柄がありません',true); return; }
  showToast(`📡 ${targets.length}件の株価を取得中...`);
  let ok=0,fail=0;
  await Promise.all(targets.map(async s=>{
    const price=await fetchYahooPrice(s.code, s.currency);
    if(price){ s.current=price; s.updatedAt=new Date().toLocaleString('ja-JP'); await saveStock(s); ok++; } else fail++;
  }));
  showToast(fail===0?`✅ ${ok}件すべて取得成功`:`✅ ${ok}件成功 / ❌ ${fail}件失敗`,fail>0&&ok===0);
};

window.updateOnePrice = async (id) => {
  const s=stocks.find(s=>String(s.id)===String(id));
  if(!s.code){ window.promptPrice(id); return; }
  showToast(`📡 ${s.name} の株価を取得中...`);
  const price=await fetchYahooPrice(s.code, s.currency);
  if(price){ s.current=price; s.updatedAt=new Date().toLocaleString('ja-JP'); await saveStock(s); showToast(`✅ ${s.name}: ¥${price.toLocaleString()}`); }
  else{ showToast(`❌ 取得失敗。手動入力します`,true); setTimeout(()=>window.promptPrice(id),1000); }
};

window.calcSettlePL = () => {
  const s = stocks.find(s => String(s.id) === String(settlingId));
  const preview = document.getElementById('s-pl-preview');
  // 指値モード: 指値価格をs-priceに同期してPL計算に使う
  const orderType = document.querySelector('#s-type-btns .reason-btn.selected')?.dataset?.type || '成行き';
  if (orderType === '指値') {
    const lv = document.getElementById('s-limit-price')?.value;
    if (lv) document.getElementById('s-price').value = lv;
  }
  const sellPrice = parseFloat(document.getElementById('s-price').value);
  if (!s || isNaN(sellPrice) || sellPrice <= 0) { preview.style.display = 'none'; return; }
  const _buyP = s.buy ?? s.cost ?? 0;
  const plPct = _buyP > 0 ? ((sellPrice - _buyP) / _buyP * 100).toFixed(2) : '0.00';
  const soldQty = parseFloat(document.getElementById('s-qty')?.value) || s.qty || null;
  const plYen = soldQty ? Math.round((sellPrice - _buyP) * soldQty) : null;
  // 残り株数を表示
  const remainEl = document.getElementById('s-qty-remain');
  if (remainEl && s.qty && soldQty) {
    const remain = s.qty - soldQty;
    if (remain < 0) {
      remainEl.textContent = '⚠️ 保有数を超えています';
      remainEl.style.color = 'var(--red)';
    } else {
      remainEl.textContent = remain === 0 ? '残り: 0株（全決済）' : `残り: ${remain}株`;
      remainEl.style.color = remain === 0 ? 'var(--muted)' : 'var(--blue)';
    }
  }
  const isWin = sellPrice >= _buyP;
  preview.style.cssText = `display:block;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-weight:600;font-size:15px;background:${isWin ? 'rgba(74,222,154,.1)' : 'rgba(248,113,113,.1)'};border:1px solid ${isWin ? 'rgba(74,222,154,.3)' : 'rgba(248,113,113,.3)'};color:${isWin ? 'var(--green)' : 'var(--red)'};`;
  preview.textContent = `${isWin ? '📈 利益' : '📉 損失'}: ${isWin ? '+' : ''}${plPct}%${plYen !== null ? ' (' + (isWin ? '+' : '') + '¥' + plYen.toLocaleString() + ')' : ''}`;
};

window.submitSettle = async () => {
  const s = stocks.find(s => String(s.id) === String(settlingId));
  if (!s) return;
  const sellPrice = parseFloat(document.getElementById('s-price').value);
  if (isNaN(sellPrice) || sellPrice <= 0) { showToast('決済価格を入力してください', true); return; }
  const soldQty = parseFloat(document.getElementById('s-qty')?.value) || s.qty || null;
  const remainQty = (s.qty && soldQty) ? s.qty - soldQty : null;
  if (soldQty && remainQty !== null && remainQty < 0) {
    showToast('⚠️ 売却数量が保有数量を超えています', true); return;
  }
  const buyPriceForSettle = s.buy ?? s.cost ?? 0;
  const plPct = buyPriceForSettle > 0 ? ((sellPrice - buyPriceForSettle) / buyPriceForSettle * 100).toFixed(2) : '0.00';
  const plYen = soldQty ? Math.round((sellPrice - buyPriceForSettle) * soldQty) : null;
  const historyItem = {
    ...s,
    sellDate: window._isValidDate(document.getElementById('s-date').value) ? document.getElementById('s-date').value : '',
    sellPrice,
    sellReason: (document.querySelector('#s-reason-btns .reason-btn.selected')?.dataset?.value) || '',
    sellMemo: document.getElementById('s-memo').value.trim(),
    plPct: parseFloat(plPct),
    plYen,
    soldQty,
    settledAt: Date.now()
  };
  if (remainQty === null || remainQty <= 0) {
    // 全決済（カードを削除）
    await setDoc(doc(db, 'history', String(s.id)), historyItem);
    await removeStock(s.id);
    window.closeSettleModal();
    showToast(`✅ 決済完了！ ${parseFloat(plPct) >= 0 ? '+' : ''}${plPct}%`);
  } else {
    // 部分決済（カードを残し株数を更新）
    await setDoc(doc(db, 'history', String(s.id) + '_' + Date.now()), historyItem);
    s.qty = remainQty;
    s.partialSettled = (s.partialSettled || 0) + 1;
    await saveStock(s);
    window.closeSettleModal();
    showToast(`✅ 部分決済！ ${soldQty}株売却 → 残り${remainQty}株`);
  }
};

window.registerOrder = async () => {
  const s = stocks.find(s => String(s.id) === String(settlingId));

  const orderType = document.querySelector('#s-type-btns .reason-btn.selected')?.dataset?.type || '成行き';
  let limitPrice = null, limitExpiry = null;
  if (orderType === '指値') {
    limitPrice = parseFloat(document.getElementById('s-limit-price').value);

    const ev = document.getElementById('s-limit-expiry').value;
    limitExpiry = window._isValidDate(ev) ? ev : null;

  execStockId = null; execOrderId = null;
};
document.getElementById('execModal').addEventListener('click', e => {
  if (e.target === document.getElementById('execModal')) window.closeExecModal();
});
window.calcExecPL = () => {
  const s = stocks.find(s => String(s.id) === String(execStockId));
  const order = s ? (s.pendingOrders || []).find(o => String(o.id) === String(execOrderId)) : null;
  const preview = document.getElementById('exec-pl-preview');
  if (!s || !order || !preview) { if (preview) preview.style.display = 'none'; return; }
  const sellPrice = parseFloat(document.getElementById('exec-price').value);
  if (isNaN(sellPrice) || sellPrice <= 0) { preview.style.display = 'none'; return; }
  const buyP = s.buy ?? s.cost ?? 0;
  const plPct = buyP > 0 ? ((sellPrice - buyP) / buyP * 100).toFixed(2) : '0.00';
  const plYen = order.qty ? Math.round((sellPrice - buyP) * order.qty) : null;
  const isWin = sellPrice >= buyP;
  preview.style.cssText = `display:block;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-weight:600;font-size:15px;background:${isWin?'rgba(74,222,154,.1)':'rgba(248,113,113,.1)'};border:1px solid ${isWin?'rgba(74,222,154,.3)':'rgba(248,113,113,.3)'};color:${isWin?'var(--green)':'var(--red)'};`;
  preview.textContent = `${isWin?'📈 利益':'📉 損失'}: ${isWin?'+':''}${plPct}%${plYen!==null?' ('+(isWin?'+':'')+'¥'+plYen.toLocaleString()+')':''}`;
};
window.submitExec = async () => {
  const s = stocks.find(s => String(s.id) === String(execStockId));
  const order = s ? (s.pendingOrders || []).find(o => String(o.id) === String(execOrderId)) : null;
  if (!s || !order) { showToast('注文が見つかりません', true); return; }
  const sellPrice = parseFloat(document.getElementById('exec-price').value);
  if (isNaN(sellPrice) || sellPrice <= 0) { showToast('約定価格を入力してください', true); return; }
  const buyP = s.buy ?? s.cost ?? 0;
  const plPct = buyP > 0 ? ((sellPrice - buyP) / buyP * 100).toFixed(2) : '0.00';
  const plYen = order.qty ? Math.round((sellPrice - buyP) * order.qty) : null;
  const { pendingOrders: _po, ...sBase } = s;
  const historyItem = { ...sBase, sellDate: window._isValidDate(document.getElementById('exec-date').value) ? document.getElementById('exec-date').value : '', sellPrice, sellReason: document.querySelector('#exec-reason-btns .reason-btn.selected')?.dataset?.value || (order.type === '指値' ? '📌 指値注文約定' : '📊 成行き注文約定'), sellMemo: document.getElementById('exec-memo').value.trim(), plPct: parseFloat(plPct), plYen, soldQty: order.qty, settledAt: Date.now() };
  await setDoc(doc(db, 'history', String(s.id) + '_' + order.id), historyItem);
  s.pendingOrders = (s.pendingOrders || []).filter(o => String(o.id) !== String(order.id));
  const remainQty = s.qty ? s.qty - order.qty : null;
  if (remainQty === null || remainQty <= 0) {
    await removeStock(s.id);
    window.closeExecModal();
    showToast(`✅ 約定完了！ ${parseFloat(plPct) >= 0 ? '+' : ''}${plPct}%`);
  } else {
    s.qty = remainQty;
    await saveStock(s);
    window.closeExecModal();
    showToast(`✅ 約定！ ${order.qty}株売却 → 残り${remainQty}株`);
  }
};
window.cancelPendingOrder = async (stockId, orderId) => {
  if (!confirm('この注文を取り消しますか？')) return;
  const s = stocks.find(s => String(s.id) === String(stockId));
  if (!s) return;
  s.pendingOrders = (s.pendingOrders || []).filter(o => String(o.id) !== String(orderId));
  await saveStock(s);
  showToast('注文を取り消しました');
};

window.importFromFile = async function(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const data = JSON.parse(e.target.result);
      const items = Array.isArray(data) ? data : data.stocks;
      if (!items || !items.length) { showToast('データが見つかりませんでした', true); return; }
      if (stocks.length > 0) {
        showToast(`⏳ 既存の${stocks.length}件を削除中...`);
        await Promise.all(stocks.map(s => removeStock(s.id)));
      }
      let added = 0;
      for (const item of items) {
        const newStock = { ...item, id: String(Date.now() + Math.random()), createdAt: Date.now() };
        await saveStock(newStock);
        added++;
      }
      showToast(`✅ ${added}件インポートしました`);
    } catch(err) { showToast('ファイルの読み込みに失敗しました', true); }
    input.value = '';
  };
  reader.readAsText(file);
};

function _jBadgeStyle(j) {
  const base = 'padding:3px 10px;font-size:11px;border-radius:20px;font-weight:700;flex-shrink:0;white-space:nowrap;display:inline-block;';
  if (j==='green')  return base+'background:rgba(74,222,154,.15);border:1px solid rgba(74,222,154,.3);color:var(--green);';
  if (j==='yellow') return base+'background:rgba(250,204,21,.15);border:1px solid rgba(250,204,21,.3);color:var(--yellow);';
  if (j==='red')    return base+'background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3);color:var(--red);';
  return base+'background:var(--surface2);border:1px solid var(--border);color:var(--muted);';
}
function _jLabel(j) {
  return j==='green'?'🟢 買い':j==='yellow'?'🟡 様子見':j==='red'?'🔴 見送り':'— 未判定';
}

function renderCandidates() {
  if (_candChartObserver) { _candChartObserver.disconnect(); _candChartObserver = null; }
  const active   = candidates.filter(c => c.status !== 'rejected');
  const rejected = candidates.filter(c => c.status === 'rejected');
  const listEl   = document.getElementById('candidateslist');
  const rejListEl= document.getElementById('rejectedlist');
  const rejBtn   = document.getElementById('rejected-toggle-btn');
  if (!listEl) return;
  if (!active.length) {
    listEl.innerHTML = '<div class="empty"><div class="icon">📋</div>候補はまだありません<br><small style="margin-top:8px;display:block">右下の＋から候補を追加してください</small></div>';
  } else {
    listEl.innerHTML = active.map(candCardHTML).join('');
    active.forEach(c => _observeCandChart(c));
  }
  if (rejBtn) rejBtn.textContent = `見送り履歴 (${rejected.length}件) ${_rejectedOpen?'▲':'▼'}`;
  if (rejListEl) {
    rejListEl.innerHTML = rejected.map(rejectedCardHTML).join('');
    rejListEl.style.display = _rejectedOpen ? '' : 'none';
  }
}

function _observeCandChart(c) {
  const el = document.getElementById('cand-tv-' + c.id);
  if (!el || el.dataset.loaded) return;
  if (!_candChartObserver) {
    _candChartObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting || entry.target.dataset.loaded) return;
        entry.target.dataset.loaded = '1';
        _candChartObserver.unobserve(entry.target);
        const tid = entry.target.id.replace('cand-tv-', '');
        _initCandChart(tid, entry.target.dataset.code, entry.target.dataset.currency);
      });
    }, { threshold: 0.1 });
  }
  _candChartObserver.observe(el);
}

async function _initCandChart(id, code, currency) {
  const wrap = document.getElementById('cand-tv-' + id);
  if (!wrap) return;
  if (!code) { wrap.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">銘柄コードを登録するとチャートが表示されます</div>'; return; }
  wrap.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">📡 チャートデータを取得中...</div>';
  let candles=null;
  try { await loadLightweightCharts(); candles=await fetchCandles(code, currency, '1d', '1y'); } catch(e){}
  if (!candles) { wrap.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">データ取得に失敗しました</div>'; return; }

  wrap.innerHTML='';
  const stateKey = 'cand-' + id;

  const toolbar = document.createElement('div');
  toolbar.style.cssText = 'display:flex;gap:4px;padding:6px 6px 4px;background:#131722;border-radius:8px 8px 0 0;';
  TF_CONFIG.forEach(tf => {
    const b = document.createElement('button');
    b.textContent = tf.label;
    b.dataset.tf = tf.interval;
    b.style.cssText = 'padding:4px 10px;border-radius:6px;border:1px solid #2a2e39;background:transparent;color:#6b7185;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;min-width:42px;';
    b.onclick = () => window.switchTF(stateKey, tf.interval);
    toolbar.appendChild(b);
  });
  wrap.appendChild(toolbar);

  const chartEl = document.createElement('div');
  chartEl.style.cssText = 'width:100%;height:240px;border-radius:0 0 8px 8px;overflow:hidden';
  wrap.appendChild(chartEl);

  const chart = LightweightCharts.createChart(chartEl, {
    width: chartEl.clientWidth, height: 240,
    layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
    timeScale: { timeVisible: false, borderColor: '#2a2e39' },
    rightPriceScale: { borderColor: '#2a2e39' },
    crosshair: { mode: 1 },
  });
  const series = chart.addCandlestickSeries({ upColor: '#4ade9a', downColor: '#f87171', wickUpColor: '#4ade9a', wickDownColor: '#f87171', borderVisible: false });
  series.setData(candles);
  const ma25s = chart.addLineSeries({ color: '#60a5fa', lineWidth: 1, priceLineVisible: false, lastValueVisible: true, title: 'MA25' });
  const ma75s = chart.addLineSeries({ color: '#fb923c', lineWidth: 1, priceLineVisible: false, lastValueVisible: true, title: 'MA75' });
  ma25s.setData(calcMA(candles, 25));
  ma75s.setData(calcMA(candles, 75));
  chart.timeScale().fitContent();

  const cache = new Map([['1d', candles]]);
  _chartState.set(stateKey, { chart, series, ma25series: ma25s, ma75series: ma75s, cache, toolbar, code, currency, buyDate: null, currentInterval: '1d', loading: false });
  _updateTFButtons(toolbar, '1d');

  new ResizeObserver(() => { chart.applyOptions({ width: chartEl.clientWidth }); }).observe(chartEl);
}

// インライン編集
window.updateCandCond = async (id, i, checked) => {
  const c=candidates.find(c=>c.id===id); if(!c) return;
  if(!c.condChecks) c.condChecks=Array(5).fill(false);
  c.condChecks[i]=checked;
  const cnt=c.condChecks.filter(Boolean).length;
  c.judgment=cnt===5?'green':cnt>=3?'yellow':cnt>0?'red':'none';
  const badge=document.getElementById('cand-judge-'+id);
  if(badge){badge.style.cssText=_jBadgeStyle(c.judgment);badge.textContent=_jLabel(c.judgment);}
  _candLocalUpdate=true;
  try{await updateDoc(doc(db,'candidates',String(id)),{condChecks:c.condChecks,judgment:c.judgment});}
  finally{setTimeout(()=>{_candLocalUpdate=false;},1500);}
};
window.updateCandNote = async (id, i, val) => {
  const c=candidates.find(c=>c.id===id); if(!c) return;
  if(!c.condNotes) c.condNotes=Array(5).fill('');
  c.condNotes[i]=val;
  _candLocalUpdate=true;
  try{await updateDoc(doc(db,'candidates',String(id)),{condNotes:c.condNotes});}
  finally{setTimeout(()=>{_candLocalUpdate=false;},1500);}
};
window.toggleCandBonus = async (id, i, checked) => {
  const c=candidates.find(c=>c.id===id); if(!c) return;
  if(!c.bonusChecks) c.bonusChecks=Array(4).fill(false);
  c.bonusChecks[i]=checked;
  _candLocalUpdate=true;
  try{await updateDoc(doc(db,'candidates',String(id)),{bonusChecks:c.bonusChecks});}
  finally{setTimeout(()=>{_candLocalUpdate=false;},1500);}
};
window.updateCandMemo = async (id, val) => {
  const c=candidates.find(c=>c.id===id); if(!c) return;
  c.memo=val;
  _candLocalUpdate=true;
  try{await updateDoc(doc(db,'candidates',String(id)),{memo:val});}
  finally{setTimeout(()=>{_candLocalUpdate=false;},1500);}
};

function renderHistory() {
  const el = document.getElementById('historylist');
  if (!el) return;
  if (!history.length) {
    el.innerHTML = `<div class="empty"><div class="icon">📋</div>決済記録はまだありません<br><small style="margin-top:8px;display:block">銘柄カードの「決済」ボタンから記録できます</small></div>`;
    return;
  }
  // 確定損益サマリー（除外フラグのないものだけ集計）
  const included = history.filter(h => !h.excluded);
  const totalPL    = included.reduce((s, h) => s + (h.plYen || 0), 0);
  const totalPLAll = history.reduce((s, h) => s + (h.plYen || 0), 0); // 除外含む全件
  const wins    = included.filter(h => (h.plPct || 0) >= 0).length;
  const losses  = included.length - wins;
  const excCount = history.length - included.length;
  const sumColor = totalPL >= 0 ? 'var(--green)' : 'var(--red)';
  const allStr = excCount > 0
    ? `<span style="font-size:11px;color:var(--muted);margin-left:6px">(全て含む: ${totalPLAll >= 0 ? '+' : ''}¥${totalPLAll.toLocaleString()})</span>`
    : '';
  const summaryHTML = `<div style="background:var(--surface2);border-radius:12px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--border)">
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px">確定損益合計${excCount>0?` <span style="font-size:10px;color:var(--muted)">(${excCount}件除外中)</span>`:''}</div>
    <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:4px">
      <span style="font-size:22px;font-weight:700;color:${sumColor}">${totalPL >= 0 ? '+' : ''}¥${totalPL.toLocaleString()}</span>
      ${allStr}
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">勝ち ${wins}件 / 負け ${losses}件</div>
  </div>`;

  el.innerHTML = summaryHTML + history.map(h => {
    const isWin = (h.plPct||0) >= 0;
    const plSign = isWin ? '+' : '';
    const plColor = isWin ? 'var(--green)' : 'var(--red)';
    const plYenBig = h.plYen != null ? `${plSign}¥${h.plYen.toLocaleString()}` : `${plSign}${h.plPct}%`;
    const plPctSmall = h.plYen != null ? `${plSign}${h.plPct}%` : '';
    // 部分決済バッジ（soldQty が qty と異なる場合）
    const partialBadge = (h.soldQty != null && h.qty != null && h.soldQty !== h.qty)
      ? `<span style="font-size:10px;background:rgba(250,204,21,.15);color:var(--yellow);border:1px solid rgba(250,204,21,.3);border-radius:6px;padding:2px 7px;font-weight:600;margin-left:6px">部分決済 ${h.soldQty}株</span>`
      : '';
    const isExcluded = !!h.excluded;
    return `<div class="hist-card" style="${isExcluded?'opacity:.5':''}">
      ${isExcluded?`<div style="font-size:10px;color:var(--muted);background:var(--surface2);border-radius:6px;padding:2px 8px;display:inline-block;margin-bottom:6px">📊 統計から除外中</div>`:''}
      <div class="sc-top">
        <div>
          <div class="sc-name">${h.name}${partialBadge}</div>
          <div class="sc-code">${h.code||'—'} · 決済日: ${h.sellDate||'—'}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:20px;font-weight:700;color:${plColor}">${plYenBig}</div>
          <div style="font-size:12px;color:${plColor}">${plPctSmall}</div>
        </div>
      </div>
      <div class="sc-bars">
        <div class="sc-bar"><div class="sc-bar-label">買値</div><div class="sc-bar-val col-buy">¥${(h.buy||0).toLocaleString()}</div></div>
        <div class="sc-bar"><div class="sc-bar-label">売値</div><div class="sc-bar-val" style="color:${plColor}">¥${(h.sellPrice||0).toLocaleString()}</div></div>
        <div class="sc-bar"><div class="sc-bar-label">株数</div><div class="sc-bar-val">${h.soldQty != null ? h.soldQty : (h.qty||'—')}株</div></div>
      </div>
      ${h.sellReason ? `<div style="font-size:12px;color:var(--muted);margin-top:6px">📝 売った理由: ${h.sellReason}</div>` : ''}
      ${h.sellMemo   ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">💭 ${h.sellMemo}</div>` : ''}
      <div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-end">
        <button onclick="toggleHistoryExclude('${h.id}')" style="font-size:11px;padding:3px 10px;border-radius:6px;background:${isExcluded?'rgba(74,222,154,.1)':'var(--surface2)'};border:1px solid ${isExcluded?'rgba(74,222,154,.3)':'var(--border)'};color:${isExcluded?'var(--green)':'var(--muted)'};cursor:pointer">${isExcluded?'✅ 統計に戻す':'📊 統計から除外'}</button>
        ${h.manualEntry ? `<button onclick="editManualHistory('${h.id}')" style="font-size:11px;padding:3px 10px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);cursor:pointer">✏️ 編集</button>
        <button onclick="deleteManualHistory('${h.id}')" style="font-size:11px;padding:3px 10px;border-radius:6px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--red);cursor:pointer">🗑 削除</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderStats() {

    el.innerHTML = `<div class="empty"><div class="icon">📊</div>決済記録がないため統計が表示できません</div>`;
    return;
  }
  const statsTarget = history.filter(h => !h.excluded); // 除外フラグのないものだけ統計対象
  const wins   = statsTarget.filter(h => (h.plPct||0) >= 0);
  const losses = statsTarget.filter(h => (h.plPct||0) <  0);
  const winRate  = statsTarget.length ? (wins.length / statsTarget.length * 100).toFixed(1) : '0.0';
  const avgWin   = wins.length   ? (wins.reduce((s,h)=>s+(h.plPct||0),0)/wins.length).toFixed(2)   : '—';
  const avgLoss  = losses.length ? (losses.reduce((s,h)=>s+(h.plPct||0),0)/losses.length).toFixed(2) : '—';

  const plColor  = totalPL >= 0 ? 'var(--green)' : 'var(--red)';
  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">勝率</div>
        <div class="stat-value ${parseFloat(winRate)>=50?'up':'down'}">${winRate}%</div>

      </div>

        <div class="stat-sub">${losses.length}件</div>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-row">
        <span style="color:var(--muted);font-size:13px">累計損益</span>
        <span style="font-size:20px;font-weight:700;color:${plColor}">${totalPL>=0?'+':''}¥${totalPL.toLocaleString()}</span>
      </div>
      <div class="summary-row">

function chartUrl(code) {
  if (!code) return null;
  if (/^\d{4,5}$/.test(code)) return `https://finance.yahoo.co.jp/quote/${code}.T`;
  return `https://finance.yahoo.com/quote/${code}`;
}

// 銘柄コードから市場を判別。US/HKはTradingView埋め込み可、JP(東証)はライセンス上埋め込み不可
function chartMarket(code, currency) {
  if (!code) return null;
  const cur = (currency || 'JPY').toUpperCase();
  if (/\.HK$/i.test(code)) { const n = code.replace(/\.HK$/i,'').replace(/^0+/,''); return { market:'HK', tv:'HKEX:'+n, num:n }; }
  if (/\.T$/i.test(code))  { const n = code.replace(/\.T$/i,''); return { market:'JP', num:n }; }
  if (/^\d{4,5}$/.test(code)) {
    if (cur === 'HKD') { const n = code.replace(/^0+/,''); return { market:'HK', tv:'HKEX:'+n, num:n }; }
    return { market:'JP', num:code };
  }
  return { market:'US', tv:code.toUpperCase() };
}

// Lightweight Charts v4 を初回だけ動的ロード
function loadLightweightCharts() {
  if (window.LightweightCharts) return Promise.resolve();
  if (window._lcPromise) return window._lcPromise;
  window._lcPromise = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js';
    sc.onload = resolve; sc.onerror = reject;
    document.head.appendChild(sc);
  });
  return window._lcPromise;
}

// 足の設定
const TF_CONFIG = [
  { label: '15分', interval: '15m', range: '5d',  timeVisible: true  },
  { label: '1時間', interval: '1h',  range: '1mo', timeVisible: true  },
  { label: '日',   interval: '1d',  range: '1y',  timeVisible: false },
  { label: '週',   interval: '1wk', range: '2y',  timeVisible: false },
  { label: '月',   interval: '1mo', range: '5y',  timeVisible: false },
];
const DEFAULT_TF = '1d';
// チャート状態キャッシュ: id -> { chart, series, cache, toolbar, code, currency, currentInterval, loading }
const _chartState = new Map();

// Yahoo Finance から指定足のローソク足を取得（既存PROXIES方式）
async function fetchCandles(code, currency, interval = '1d', range = '1y') {
  if (!code) return null;
  const isIntraday = interval === '15m' || interval === '1h';
  let syms;
  if (/\./.test(code)) {
    syms = [code];
  } else if (/^\d{4,5}$/.test(code)) {
    // 通貨で単一シンボルに確定: HKD→.HK / それ以外(JPY等)→.T（シンボル取り違え防止）
    syms = [(currency === 'HKD') ? code + '.HK' : code + '.T'];
  } else {
    syms = [code];
  }
  const cb = Date.now();
  const attempts = [];
  for (const sym of syms)
    for (const ep of [
      `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=${interval}&range=${range}&_=${cb}`,
      `https://query2.finance.yahoo.com/v8/finance/chart/${sym}?interval=${interval}&range=${range}&_=${cb}`
    ])
      for (const mkProxy of PROXIES)
        attempts.push(
          fetchWithTimeout(mkProxy(ep)).then(r => { if (!r.ok) throw 0; return r.json(); }).then(data => {
            const parsed = typeof data === 'string' ? JSON.parse(data) : data;
            const result = parsed?.chart?.result?.[0];
            if (!result) throw 0;
            const ts = result.timestamp;
            const q  = result.indicators.quote[0];
            const candles = ts.map((t, i) => {
              const time = isIntraday ? t : (() => {
                const d = new Date(t * 1000);
                return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
              })();
              return { time, open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i] };
            }).filter(c => c.open != null && c.high != null && c.low != null && c.close != null);
            if (!candles.length) throw 0;
            return candles;
          })
        );
  try { return await Promise.any(attempts); } catch (e) { return null; }
}

// データ取得失敗時の外部リンクフォールバック
function fallbackLinksHTML(m) {
  const aStyle = `style="text-decoration:none;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:12px"`;
  const header = `<div style="padding:14px 12px;text-align:center"><div style="font-size:11px;color:var(--muted);margin-bottom:10px">データ取得に失敗しました。外部チャートで確認してください。</div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">`;
  const footer = `</div></div>`;
  if (!m) return header + footer;
  if (m.market === 'JP') return header +
    `<a href="https://finance.yahoo.co.jp/quote/${m.num}.T" target="_blank" rel="noopener" ${aStyle}>📈 Yahoo!ファイナンス</a>` +
    `<a href="https://kabutan.jp/stock/chart?code=${m.num}" target="_blank" rel="noopener" ${aStyle}>📊 株探</a>` +
    `<a href="https://jp.tradingview.com/symbols/TSE-${m.num}/" target="_blank" rel="noopener" ${aStyle}>📉 TradingView</a>` + footer;
  return header +
    `<a href="https://jp.tradingview.com/symbols/${m.tv || m.num}/" target="_blank" rel="noopener" ${aStyle}>📉 TradingView</a>` + footer;
}

// 購入日マーカーをローソク足にセット（足切り替え時に再付与）
function _applyBuyMarker(series, buyDate, candles, isIntraday) {
  if (!buyDate || !candles.length) { series.setMarkers([]); return; }
  let markerTime;
  if (isIntraday) {
    const match = candles.find(c => {
      const d = new Date(c.time * 1000);
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}` === buyDate;
    });
    markerTime = match ? match.time : candles[0].time;
  } else {
    const first = candles[0].time;
    if (buyDate < first) {
      markerTime = first; // 期間外はクランプ
    } else {
      const match = candles.find(c => c.time >= buyDate);
      markerTime = match ? match.time : candles[candles.length - 1].time;
    }
  }
  series.setMarkers([{ time: markerTime, position: 'belowBar', color: '#9ca3af', shape: 'arrowUp', text: '買' }]);
}

// 足ボタンのハイライトを更新
function _updateTFButtons(toolbar, activeInterval) {
  toolbar.querySelectorAll('button[data-tf]').forEach(b => {
    const on = b.dataset.tf === activeInterval;
    b.style.background  = on ? 'rgba(96,165,250,.2)' : 'transparent';
    b.style.color       = on ? '#60a5fa' : '#6b7185';
    b.style.borderColor = on ? '#60a5fa' : '#2a2e39';
  });
}

// 足切り替え（ボタンから呼ばれる）
function calcMA(candles, period) {
  return candles.map((c, i) => {
    if (i < period - 1) return null;
    const sum = candles.slice(i - period + 1, i + 1).reduce((s, x) => s + x.close, 0);
    return { time: c.time, value: sum / period };
  }).filter(Boolean);
}

window.switchTF = async (id, interval) => {
  const state = _chartState.get(String(id));
  if (!state || state.loading) return;
  const tf = TF_CONFIG.find(t => t.interval === interval);
  if (!tf) return;

  _updateTFButtons(state.toolbar, interval);

  const _isId = (iv) => iv === '15m' || iv === '1h';

  // キャッシュがあれば即差し替え
  if (state.cache.has(interval)) {
    const cached = state.cache.get(interval);
    state.series.setData(cached);
    state.ma25series?.setData(calcMA(cached, 25));
    state.ma75series?.setData(calcMA(cached, 75));
    state.chart.applyOptions({ timeScale: { timeVisible: tf.timeVisible } });
    state.chart.timeScale().fitContent();
    _applyBuyMarker(state.series, state.buyDate, cached, _isId(interval));
    state.currentInterval = interval;
    return;
  }

  // 取得中：ボタン無効化
  state.loading = true;
  state.toolbar.querySelectorAll('button').forEach(b => { b.disabled = true; b.style.opacity = '.5'; });

  const candles = await fetchCandles(state.code, state.currency, interval, tf.range);

  state.loading = false;
  state.toolbar.querySelectorAll('button').forEach(b => { b.disabled = false; b.style.opacity = '1'; });

  if (!candles) {
    showToast('データ取得に失敗しました', true);
    _updateTFButtons(state.toolbar, state.currentInterval);
    return;
  }

  state.cache.set(interval, candles);
  state.series.setData(candles);
  state.ma25series?.setData(calcMA(candles, 25));
  state.ma75series?.setData(calcMA(candles, 75));
  state.chart.applyOptions({ timeScale: { timeVisible: tf.timeVisible } });
  state.chart.timeScale().fitContent();
  _applyBuyMarker(state.series, state.buyDate, candles, _isId(interval));
  state.currentInterval = interval;
};

window.toggleChart = async (id) => {
  const wrap = document.getElementById('tv-' + id);
  const btn  = document.getElementById('tv-btn-' + id);
  if (!wrap) return;
  const isOpen = wrap.style.display !== 'none';
  wrap.style.display = isOpen ? 'none' : 'block';
  btn.textContent = isOpen ? '📊 チャートを表示 ▼' : '📊 チャートを閉じる ▲';
  if (isOpen || wrap.dataset.loaded) return;

  wrap.dataset.loaded = '1';
  const s = stocks.find(s => String(s.id) === String(id));
  if (!s) return;
  const code = s.code ?? s.ticker ?? '';
  const m = chartMarket(code, s.currency);

  if (!code) {
    wrap.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">銘柄コードを登録するとチャートが表示されます</div>`;
    return;
  }

  wrap.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">📡 チャートデータを取得中...</div>`;

  let initCandles = null;
  try {
    await loadLightweightCharts();
    initCandles = await fetchCandles(code, s.currency, DEFAULT_TF, '1y');
  } catch (e) {}

  if (!initCandles) { wrap.innerHTML = fallbackLinksHTML(m); return; }

  // DOM 構築
  wrap.innerHTML = '';

  // 足切り替えツールバー
  const toolbar = document.createElement('div');
  toolbar.style.cssText = 'display:flex;gap:4px;padding:6px 6px 4px;background:#131722;border-radius:8px 8px 0 0;';
  TF_CONFIG.forEach(tf => {
    const b = document.createElement('button');
    b.textContent = tf.label;
    b.dataset.tf = tf.interval;
    b.style.cssText = 'padding:4px 10px;border-radius:6px;border:1px solid #2a2e39;background:transparent;color:#6b7185;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;min-width:42px;';
    b.onclick = () => window.switchTF(id, tf.interval);
    toolbar.appendChild(b);
  });
  wrap.appendChild(toolbar);

  // チャートコンテナ
  const chartEl = document.createElement('div');
  chartEl.style.cssText = 'width:100%;height:300px;border-radius:0 0 8px 8px;overflow:hidden';
  wrap.appendChild(chartEl);

  const chart = LightweightCharts.createChart(chartEl, {
    width: chartEl.clientWidth, height: 300,
    layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
    timeScale: { timeVisible: false, borderColor: '#2a2e39' },
    rightPriceScale: { borderColor: '#2a2e39' },
    crosshair: { mode: 1 },
  });

  const series = chart.addCandlestickSeries({
    upColor: '#4ade9a', downColor: '#f87171',
    wickUpColor: '#4ade9a', wickDownColor: '#f87171', borderVisible: false,
  });
  series.setData(initCandles);
  _applyBuyMarker(series, s.buyDate, initCandles, false); // 日足なのでイントラデイ=false

  // 移動平均線 MA25 (青) / MA75 (オレンジ)
  const ma25series = chart.addLineSeries({ color: '#60a5fa', lineWidth: 1, priceLineVisible: false, lastValueVisible: true, title: 'MA25' });
  const ma75series = chart.addLineSeries({ color: '#fb923c', lineWidth: 1, priceLineVisible: false, lastValueVisible: true, title: 'MA75' });
  ma25series.setData(calcMA(initCandles, 25));
  ma75series.setData(calcMA(initCandles, 75));

  // title=''でチャート内テキストを非表示、右軸ラベルのみ表示（ローソク足を隠さないため）
  if (s.buy)    series.createPriceLine({ price: s.buy,    color: '#9ca3af', lineWidth: 1, lineStyle: 0, axisLabelVisible: true, title: '' });
  if (s.target) series.createPriceLine({ price: s.target, color: '#60a5fa', lineWidth: 2, lineStyle: 2, axisLabelVisible: true, title: '' });
  if (s.loss)   series.createPriceLine({ price: s.loss,   color: '#f87171', lineWidth: 2, lineStyle: 2, axisLabelVisible: true, title: '' });

  chart.timeScale().fitContent();

  // 状態をキャッシュ
  const cache = new Map([[DEFAULT_TF, initCandles]]);
  _chartState.set(String(id), { chart, series, ma25series, ma75series, cache, toolbar, code, currency: s.currency, buyDate: s.buyDate, currentInterval: DEFAULT_TF, loading: false });
  _updateTFButtons(toolbar, DEFAULT_TF);

  // レスポンシブ: カード幅が変わったらチャート幅を追従
  const ro = new ResizeObserver(() => {
    if (wrap.style.display !== 'none') chart.applyOptions({ width: chartEl.clientWidth });
  });
  ro.observe(chartEl);
};

function getSellSign(s) {
  const buy = s.buy ?? s.cost ?? 0;
  const cur = s.current ?? s.price ?? buy;
  if (!s.target || !s.loss || !buy) return null;
  const ach    = (cur - buy) / (s.target - buy) * 100;
  const toTgt  = (s.target - cur) / cur * 100;
  const toLoss = (cur - s.loss) / cur * 100;
  if (cur <= s.loss)   return { type:'loss',   label:`🚨 損切ライン割れ → ルール通り売り`,                color:'var(--red)',    bg:'rgba(248,113,113,.15)', border:'rgba(248,113,113,.3)' };
  if (cur >= s.target) return { type:'target', label:`💰 利確圏 → 売り or 引き上げ判断`,                  color:'var(--green)',  bg:'rgba(74,222,154,.15)',  border:'rgba(74,222,154,.3)'  };
  if (ach >= 80)       return { type:'near',   label:`🎯 利確接近（目標まで +${toTgt.toFixed(1)}%）`,     color:'var(--yellow)', bg:'rgba(250,204,21,.15)',  border:'rgba(250,204,21,.3)'  };
  if (cur > buy)       return { type:'hold',   label:`📈 保有継続（目標まで +${toTgt.toFixed(1)}%）`,     color:'var(--blue)',   bg:'rgba(96,165,250,.15)',  border:'rgba(96,165,250,.3)'  };
  return               { type:'watch',  label:`👀 様子見（損切まで -${toLoss.toFixed(1)}%）`, color:'var(--muted)', bg:'var(--surface2)',       border:'var(--border)'        };
}

const _expandedBars = new Set();
window.togglePriceBars = (id) => {
  const barsEl = document.getElementById('sc-bars-' + id);
  const btnEl  = document.getElementById('pricebar-btn-' + id);
  if (!barsEl || !btnEl) return;
  if (_expandedBars.has(id)) {
    _expandedBars.delete(id);
    barsEl.style.display = 'none';
    btnEl.textContent = '▼ 詳細';
  } else {
    _expandedBars.add(id);
    barsEl.style.display = '';
    btnEl.textContent = '▲ 閉じる';
  }
};

function render() {
  const el=document.getElementById('watchlist');
  if(!stocks.length){ el.innerHTML=`<div class="empty"><div class="icon">📋</div>右下の＋から銘柄を追加してください</div>`; return; }
  // ソート
  const sortKey = document.getElementById('sortSelect')?.value || 'signal';
  // 売りサイン優先度（signal_priority）
  const signalPriority = s => {
    const sg = getSellSign(s);
    if (!sg) return 5;
    return {loss:0, target:1, near:2, hold:3, watch:4}[sg.type] ?? 5;
  };
  const sorted = [...stocks].sort((a, b) => {
    const buyA = a.buy ?? a.cost ?? 0, curA = a.current ?? a.price ?? buyA;
    const buyB = b.buy ?? b.cost ?? 0, curB = b.current ?? b.price ?? buyB;
    const pnlA = buyA > 0 ? (curA - buyA) * (parseFloat(a.qty)||1) : 0;
    const pnlB = buyB > 0 ? (curB - buyB) * (parseFloat(b.qty)||1) : 0;
    const rateA = buyA > 0 ? (curA - buyA) / buyA : 0;
    const rateB = buyB > 0 ? (curB - buyB) / buyB : 0;
    if (sortKey === 'signal')    return signalPriority(a) - signalPriority(b);
    if (sortKey === 'name')      return (a.name||'').localeCompare(b.name||'', 'ja');
    if (sortKey === 'pnl_desc')  return pnlB - pnlA;
    if (sortKey === 'pnl_asc')   return pnlA - pnlB;
    if (sortKey === 'rate_desc') return rateB - rateA;
    if (sortKey === 'rate_asc')  return rateA - rateB;
    return (a.createdAt||0) - (b.createdAt||0);
  });
  el.innerHTML=sorted.map(s=>{
    // ダッシュボードから同期された銘柄はフィールド名が異なる場合がある
    const buyPrice = s.buy ?? s.cost ?? 0;
    const currentPrice = s.current ?? s.price ?? buyPrice;
    const stockCode = s.code ?? s.ticker ?? '';
    // 表示用にフィールドを正規化
    if(!s.buy && s.cost) s.buy = s.cost;
    if(!s.current && s.price) s.current = s.price;
    if(!s.code && s.ticker) s.code = s.ticker;
    const diff = currentPrice - buyPrice;
    const rate = buyPrice > 0 ? (diff/buyPrice*100).toFixed(2) : '0.00';
    const rc=diff>0?'up':diff<0?'down':'flat';
    const sign=diff>0?'+':'';
    // 評価損益金額 (qty がある銘柄のみ)
    const qty = parseFloat(s.qty) || 0;
    let pnlHTML = '';
    if (qty > 0 && buyPrice > 0) {
      const pnlNative = diff * qty;
      const currency = (s.currency || 'JPY').toUpperCase();
      let pnlJPY = null;
      try {
        const fxData = localStorage.getItem('portfolio_v6_fx');
        const fx = fxData ? JSON.parse(fxData) : {};
        if (currency === 'JPY') pnlJPY = pnlNative;
        else if (currency === 'USD' && fx.USD) pnlJPY = pnlNative * fx.USD;
        else if (currency === 'HKD' && fx.HKD) pnlJPY = pnlNative * fx.HKD;
      } catch(e) {}
      const pnlColor = pnlNative >= 0 ? 'var(--green)' : 'var(--red)';
      const pnlSign = pnlNative >= 0 ? '+' : '';
      if (pnlJPY !== null) {
        pnlHTML = `<div style="margin-top:5px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap"><span style="font-size:16px;color:${pnlColor};font-weight:700;letter-spacing:-.3px;line-height:1.2">${pnlSign}¥${Math.round(pnlJPY).toLocaleString()}</span><span style="font-size:11px;color:var(--muted);font-weight:400">${qty.toLocaleString()}株</span></div>`;
      } else if (currency !== 'JPY') {
        const sym = currency === 'USD' ? '$' : currency === 'HKD' ? 'HK$' : currency + ' ';
        pnlHTML = `<div style="margin-top:5px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap"><span style="font-size:16px;color:${pnlColor};font-weight:700;letter-spacing:-.3px;line-height:1.2">${pnlSign}${sym}${Math.abs(pnlNative).toLocaleString(undefined,{maximumFractionDigits:2})}</span><span style="font-size:11px;color:var(--muted);font-weight:400">${qty.toLocaleString()}株</span></div>`;
      }
    }
    // 注文中リスト
    const _today = new Date().toISOString().slice(0,10);
    const pendingOrdersHTML = (s.pendingOrders && s.pendingOrders.length > 0)
      ? s.pendingOrders.map(order => {
          const _exp = order.type === '指値' && order.limitExpiry && _today > order.limitExpiry;
          const _ps = order.type === '指値' && order.limitPrice ? ` ¥${Number(order.limitPrice).toLocaleString()}` : '';
          const _es = order.limitExpiry ? ` (〜${order.limitExpiry})` : '';
          return `<div style="background:rgba(96,165,250,.07);border:1px solid ${_exp?'rgba(248,113,113,.4)':'rgba(96,165,250,.2)'};border-radius:8px;padding:8px 10px">
            <div style="color:${_exp?'var(--red)':'var(--blue)'};font-size:12px;font-weight:600;margin-bottom:6px">📋 注文中 ${order.qty}株｜${order.type}${_ps}${_es}${_exp?' <span style="color:var(--red);font-size:11px">⚠️ 期限切れ</span>':''}</div>
            <div style="display:flex;gap:6px">
              <button onclick="openExecModal('${s.id}','${order.id}')" style="background:rgba(74,222,154,.15);color:var(--green);border:1px solid rgba(74,222,154,.3);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">✅ 約定入力</button>
              <button onclick="cancelPendingOrder('${s.id}','${order.id}')" style="background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.3);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">❌ 取消</button>
            </div>
          </div>`;
        }).join('')
      : '';
    const jClass=s.judgment||'none';
    const jLabel=jClass==='green'?'🟢 買い':jClass==='yellow'?'🟡 様子見':jClass==='red'?'🔴 見送り':'— 未判定';
    const condDots=(s.condChecks||[]).map(ok=>`<span class="cond-dot ${ok?'on':'off'}"></span>`).join('');
    const fromDash = s.fromDashboard === true;
    const url=chartUrl(stockCode);

    // ── ゲージバー（購入価格基点・複数目標ライン対応）──
    let gaugeHTML = '';
    if (s.loss && s.target) {
      const lo  = s.loss;
      const buy = buyPrice;
      const cur = currentPrice;

      // 目標ライン全履歴（古い順）＋現在の目標
      const tHistory = s.targetHistory || [];
      const allTiers = [
        ...tHistory.map((t, i) => ({ price: t.price, label: i === 0 ? '初目標' : `${i}次`, exceeded: true })),
        { price: s.target, label: tHistory.length === 0 ? '初目標' : `${tHistory.length}次`, exceeded: false }
      ];
      const maxTarget = Math.max(...allTiers.map(t => t.price));

      // 座標空間: 損切 → 最大目標
      const cRange = maxTarget - lo;
      const p = v => cRange > 0 ? (v - lo) / cRange * 100 : 50;

      const buyPos = Math.max(1, Math.min(p(buy), 99));
      const curPos = Math.max(-2, Math.min(p(cur), 116));

      const isPast = cur >= s.target;
      const isLoss = cur <= lo;

      // ゾーン（赤: 損切〜購入 / 緑: 購入〜最大目標）
      const redZone   = `<div style="position:absolute;top:0;left:0;width:${buyPos.toFixed(1)}%;height:100%;border-radius:4px 0 0 4px;background:rgba(248,113,113,.28)"></div>`;
      const greenZone = `<div style="position:absolute;top:0;left:${buyPos.toFixed(1)}%;width:${(100-buyPos).toFixed(1)}%;height:100%;border-radius:0 4px 4px 0;background:rgba(74,222,154,.18)"></div>`;

      // 目標ティアマーカー（超過済み=灰色 / 現在=青 or 緑）
      const tierMarkers = allTiers.map(t => {
        const pos = Math.max(0, Math.min(p(t.price), 100));
        const color = t.exceeded ? '#6b7185' : (cur >= t.price ? 'var(--green)' : 'var(--blue)');
        return `<div style="position:absolute;top:-4px;left:${pos.toFixed(1)}%;width:2px;height:16px;background:${color};transform:translateX(-50%);border-radius:1px;z-index:4"></div>`;
      }).join('');

      // 損切マーカー（左端）・購入価格マーカー（ミュート）・現在値マーカー
      const lossMarker = `<div style="position:absolute;top:-4px;left:0%;width:2px;height:16px;background:var(--red);border-radius:1px;z-index:4"></div>`;
      const buyMarker  = `<div style="position:absolute;top:-2px;left:${buyPos.toFixed(1)}%;width:2px;height:12px;background:var(--muted);border-radius:1px;transform:translateX(-50%);opacity:.7;z-index:3" title="購入価格 ¥${buy.toLocaleString()}"></div>`;
      const curMarker  = `<div class="gauge-marker" style="left:${curPos.toFixed(1)}%;background:${isPast?'var(--green)':'white'};z-index:5"></div>`;

      // 目標ティアラベル（バー下に配置）
      const tierLabels = allTiers.map(t => {
        const pos = Math.max(0, Math.min(p(t.price), 100));
        const color = t.exceeded ? '#6b7185' : (cur >= t.price ? 'var(--green)' : 'var(--blue)');
        const pct = buy > 0 ? ((t.price - buy) / buy * 100).toFixed(0) : '?';
        return `<span style="position:absolute;left:${pos.toFixed(1)}%;transform:translateX(-50%);color:${color};font-size:9px;white-space:nowrap;text-align:center;line-height:1.4">+${pct}%<br>${t.label}</span>`;
      }).join('');

      // 残距離ラベル
      const lossDistNum = buy > 0 ? (cur - lo) / buy * 100 : null;
      const tgtDistNum  = buy > 0 ? (s.target - cur) / buy * 100 : null;
      const fromBuyPct  = buy > 0 ? (cur - buy) / buy * 100 : null;
      const lossStr = lossDistNum === null ? '' : lossDistNum < 0
        ? `<span style="font-size:11px;font-weight:600;color:var(--red)">損切割れ ${lossDistNum.toFixed(1)}%</span>`

      const fromBuyStr = fromBuyPct !== null
        ? `<span style="font-size:11px;font-weight:700;color:${fromBuyPct >= 0 ? 'var(--green)' : 'var(--red)'}">購入から ${fromBuyPct >= 0 ? '+' : ''}${fromBuyPct.toFixed(1)}%</span>`
        : '';
      const tgtStr = cur >= s.target
        ? `<span style="font-size:11px;font-weight:600;color:var(--green)">目標超過 🎯</span>`
        : tgtDistNum !== null
          ? `<span style="font-size:11px;font-weight:600;color:var(--blue)">目標まで +${tgtDistNum.toFixed(1)}%</span>`
          : '';

      gaugeHTML = `
        <div class="gauge-wrap">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px">
            <span style="color:var(--red)">損切 ¥${lo.toLocaleString()}</span>
            <span style="color:var(--muted)">購入 ¥${buy.toLocaleString()}</span>
            <span style="color:${isPast?'var(--green)':'var(--blue)'}">目標 ¥${s.target.toLocaleString()}</span>
          </div>
          <div class="gauge-track" style="overflow:visible">
            ${redZone}${greenZone}
            ${lossMarker}${tierMarkers}${buyMarker}${curMarker}
          </div>
          <div style="position:relative;height:28px;margin-top:5px">
            ${tierLabels}
          </div>
          <div class="gauge-remain">
            ${lossStr}${fromBuyStr}${tgtStr}

    // 特定/NISAバッジ（インライン・小さめ）

      : s.account === '特定'
      ? `<span style="font-size:10px;background:rgba(107,113,133,.12);color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:1px 6px;flex-shrink:0">特定</span>`

    // 売りサインバッジ（コンパクト表示でも常に出す）
    const _sign = getSellSign(s);
    const signBadgeHTML = _sign
      ? `<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:${_sign.bg};color:${_sign.color};border:1px solid ${_sign.border}">${_sign.label}</span>`
      : '';
    return `<div class="stock-card" style="${s.settled?'opacity:.6':''}">

        <div style="flex:1;min-width:0">

      <!-- ▼ 常時表示ヘッダー（タップで展開） -->
      <div onclick="toggleCardExpand('${s.id}')" style="cursor:pointer">
